spring:
  application:
    name: cartflow

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:29092}

    streams:
      application-id: cartflow-${GROUPE:grp00}

      # Place les états locaux Kafka Streams dans target/.
      # Ils seront ainsi supprimés automatiquement par "mvn clean".
      state-dir: ${KAFKA_STREAMS_STATE_DIR:target/kafka-streams}

      properties:
        default.key.serde: org.apache.kafka.common.serialization.Serdes$StringSerde
        default.value.serde: org.apache.kafka.common.serialization.Serdes$StringSerde
        auto.offset.reset: earliest
        # CART-2 : par defaut (0), Kafka Streams n'attend pas d'avoir des
        # donnees sur les DEUX cotes d'un join avant d'avancer son horloge
        # interne (stream time). En rejeu massif (DataLoader envoie tout un
        # fichier d'un coup en quelques secondes), ca fait fermer des
        # fenetres de join avant que le paiement pourtant a l'heure soit
        # traite. idle=0 confirme nettement moins de commandes que toute
        # valeur positive (8 760 contre ~20-25k+ sur le meme jeu de
        # donnees) : la valeur par defaut est clairement mauvaise ici.
        #
        # Au-dela de "positif vs zero", on n'a PAS reussi a obtenir un
        # nombre de confirmations stable/reproductible en rejeu instantane,
        # meme entre deux cycles reset+init+run+load strictement identiques
        # (ex: 20 780 puis 19 930 a idle=10s) : le resultat depend de
        # micro-variations d'ordonnancement systeme (reseau Docker, disque,
        # GC) qu'on ne maitrise pas completement en local. Ce n'est pas
        # represantatif des conditions reelles de soutenance, ou le
        # generateur produit en continu et interleave naturellement
        # orders/payments. Pour tester CART-2 localement de facon plus
        # fiable, preferer `make stream` (envoi entrelace et paced) a
        # `make load` (rejeu instantane).
        max.task.idle.ms: 10000

        # CART-5 : désactive le cache des state stores.
        #
        # Une KTable peut compacter plusieurs modifications successives
        # d'une même clé avant de les transmettre en aval. Une valeur à 9
        # suivie rapidement d'une valeur à 7 pourrait alors être réduite à
        # la dernière mise à jour.
        #
        # La valeur 0 garantit :
        # - la publication continue des niveaux de stock ;
        # - la détection du passage exact de >= 10 vers < 10.
        statestore.cache.max.bytes: 0

        # Bonus fiabilite (CART-6) :
        # processing.guarantee: exactly_once_v2

logging:
  level:
    fr.esgi.kafka: INFO